version: 2

updates:
  # Keeps the SHA pins in .github/workflows up to date. Dependabot reads the
  # trailing "# vX.Y.Z" comment on each `uses:` line and rewrites both the SHA
  # and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # minor and patch bumps arrive as one PR; majors get their own so the
    # release notes can be read before merging
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
